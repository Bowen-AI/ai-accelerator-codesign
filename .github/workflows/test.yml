name: Test CPU-only teaching labs
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s labs -p 'test_*.py'
      - name: Run simulator
        run: python labs/roofline.py --demo
